[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cap6545"
version = "0.1.0"
description = "Conformal prediction intervals under distribution shift for protein-ligand binding affinity (CAP 6545 final project)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Taiwo Olabamipe" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cap6545.data" = ["*.csv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
